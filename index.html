<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Devgad Open World — Prototype</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd9ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
  #game{position:fixed;inset:0} canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none;color:white;text-shadow:0 2px 4px #123}
  .panel{background:#071b2dcc;border:1px solid #8de6ff66;border-radius:14px;padding:10px 12px;backdrop-filter:blur(5px);max-width:75%}
  #title{font-weight:900;font-size:15px;letter-spacing:.5px} #status{font-size:12px;opacity:.95;margin-top:3px}
  #hint{font-size:11px;text-align:right;max-width:44%}
  #controls{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;gap:10px}
  .cluster{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:48px 48px 48px;gap:5px}
  button{border:1px solid #ffffff77;background:#09283bcc;color:white;font-weight:800;border-radius:13px;font-size:17px;box-shadow:0 3px 0 #03111d88;touch-action:none;user-select:none;-webkit-user-select:none}
  button:active,.pressed{background:#078bd9ee;transform:translateY(1px)}
  .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
  #actions{display:flex;flex-direction:column;gap:8px;align-items:stretch}
  #actions button{font-size:12px;padding:12px 13px;min-width:104px}
  #drive{background:#087f8cdd}
  #toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#071b2de8;color:#fff;border-radius:12px;padding:9px 13px;font-size:12px;display:none;text-align:center;max-width:85%}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#102a40;color:white;z-index:5;text-align:center;padding:24px}
  #loading small{display:block;opacity:.75;margin-top:8px}
  @media(min-width:800px){#controls{padding:0 28px 20px}.cluster{transform:scale(1.1);transform-origin:bottom left}#actions button{font-size:14px}#hint{font-size:13px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><strong>Loading Devgad Open World…</strong><small>First prototype • needs internet for the 3D engine</small></div></div>
<div id="hud">
  <div class="panel"><div id="title">🌊 DEVGAD OPEN WORLD</div><div id="status">On foot • Explore the coast</div></div>
  <div class="panel" id="hint">Prototype map — inspired by coastal Devgad<br>Move: buttons / WASD</div>
</div>
<div id="toast"></div>
<div id="controls">
  <div class="cluster">
    <button class="up" data-key="forward" aria-label="Forward">▲</button>
    <button class="left" data-key="left" aria-label="Turn left">◀</button>
    <button class="down" data-key="back" aria-label="Back">▼</button>
    <button class="right" data-key="right" aria-label="Turn right">▶</button>
  </div>
  <div id="actions">
    <button id="drive">🚗 Enter / Exit</button>
    <button id="vehicle">🏍️ Switch Car / Bike</button>
    <button id="reset">↻ Reset</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const loading=document.getElementById('loading'), status=document.getElementById('status'), toast=document.getElementById('toast');
  if(!window.THREE){loading.innerHTML='<div><strong>3D engine did not load</strong><small>Check your internet connection, then refresh this page.</small></div>';return;}
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8bd6ed); scene.fog=new THREE.Fog(0x8bd6ed,95,250);
  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
  const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=false;
  renderer.outputColorSpace=THREE.SRGBColorSpace; document.getElementById('game').appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xd9f7ff,0x557044,2.0));
  const sun=new THREE.DirectionalLight(0xfff1cf,2.0);sun.position.set(-35,65,25);scene.add(sun);
  const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
  const green=mat(0x6eaa5a), grass=mat(0x78b765), sand=mat(0xe6d19a), roadmat=mat(0x454b50), lineMat=mat(0xf7e8ae), blue=mat(0x168fc4), white=mat(0xf4f4e8), red=mat(0xd94b36), dark=mat(0x222a31), brown=mat(0x80553a), roof=mat(0xb94f36), leaf=mat(0x247c4b), trunk=mat(0x765038);
  function box(w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);scene.add(o);return o;}
  // Broad island terrain and sea; simple low-poly coastal prototype
  box(260,1,260,grass,0,-.65,0);
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x168bb8));sea.rotation.x=-Math.PI/2;sea.position.set(0,-.15,-130);scene.add(sea);
  // Coastline sand strip at the north side
  box(260,.12,24,sand,0,-.08,-101);
  // Main roads
  box(18,.08,220,roadmat,0,.02,0); box(220,.08,14,roadmat,0,.03,18);
  for(let z=-95;z<105;z+=12)box(.22,.025,5,lineMat,0,.08,z);
  for(let x=-100;x<105;x+=14)box(5,.025,.22,lineMat,x,.08,18);
  // Small side roads
  box(7,.06,100,roadmat,-47,.02,-8);box(90,.06,7,roadmat,-20,.02,-45);box(7,.06,70,roadmat,48,.02,52);
  function tree(x,z,scale=1){const t=new THREE.Mesh(new THREE.CylinderGeometry(.28*scale,.42*scale,3.2*scale,6),trunk);t.position.set(x,1.5*scale,z);scene.add(t);for(let i=0;i<5;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(1.45*scale,2.7*scale,5),leaf);f.position.set(x+(Math.random()-.5)*.7,3.1*scale+i*.23*scale,z+(Math.random()-.5)*.7);f.rotation.y=Math.random()*2;scene.add(f);}}
  function house(x,z,c){const wall=mat(c);box(7,4.1,6,wall,x,2.05,z);const r=new THREE.Mesh(new THREE.ConeGeometry(5.1,2.5,4),roof);r.rotation.y=Math.PI/4;r.position.set(x,5.1,z);scene.add(r);box(1.2,2.3,.15,dark,x,1.15,z+3.08);box(1.1,1.1,.16,blue,x-2,2.5,z+3.1);}
  const colors=[0xf0c878,0xe9e2d0,0xe3a28a,0xc7d7a3,0xd8c3ef,0xf4e8bb];
  for(let i=0;i<26;i++){let x,z; do{x=(Math.random()-.5)*175;z=(Math.random()-.5)*180;}while((Math.abs(x)<15&&Math.abs(z)<25)||(Math.abs(x+47)<7&&Math.abs(z+8)<8));house(x,z,colors[i%colors.length]);}
  for(let i=0;i<90;i++){let x=(Math.random()-.5)*240,z=(Math.random()-.5)*210;if(Math.abs(x)<12||Math.abs(z-18)<10||z<-91)continue;tree(x,z,.65+Math.random()*.55);}
  // A simple lighthouse landmark along the coast
  const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.3,3,12,8),white);tower.position.set(36,6,-88);scene.add(tower);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,1.3,8),red);cap.position.set(36,12.6,-88);scene.add(cap);
  box(4,3,4,white,36,14.5,-88);
  // Player group and vehicle models
  const player=new THREE.Group();scene.add(player);
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,.9,3,6),mat(0x1769d2));body.position.y=1.15;player.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,8,6),mat(0xe8b88b));head.position.y=2.05;player.add(head);
  const car=new THREE.Group();scene.add(car);
  const carBody=new THREE.Mesh(new THREE.BoxGeometry(2.2,.85,4),red);carBody.position.y=.9;car.add(carBody);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.8,1.8),blue);cabin.position.set(0,1.65,-.15);car.add(cabin);
  for(const x of [-1.13,1.13])for(const z of [-1.3,1.3]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,10),dark);w.rotation.z=Math.PI/2;w.position.set(x,.48,z);car.add(w);}
  const bike=new THREE.Group();scene.add(bike);
  const frame=new THREE.Mesh(new THREE.BoxGeometry(.45,.45,1.8),dark);frame.position.y=.85;bike.add(frame);
  const tank=new THREE.Mesh(new THREE.SphereGeometry(.48,8,6),red);tank.scale.set(1,.7,1.1);tank.position.set(0,1.15,-.2);bike.add(tank);
  for(const z of [-.85,.85]){const w=new THREE.Mesh(new THREE.TorusGeometry(.42,.1,6,12),dark);w.position.set(0,.48,z);bike.add(w);}
  let mode='foot', vehicleType='car', heading=0;const keys={forward:false,back:false,left:false,right:false};const speed={foot:8,car:19,bike:23};
  player.position.set(0,0,40);car.position.set(0,0,40);bike.position.set(0,0,40);
  function active(){return mode==='foot'?player:(vehicleType==='car'?car:bike);}
  function updateVisibility(){player.visible=mode==='foot';car.visible=mode==='vehicle'&&vehicleType==='car';bike.visible=mode==='vehicle'&&vehicleType==='bike';status.textContent=(mode==='foot'?'On foot':vehicleType==='car'?'Driving car':'Riding bike')+' • Explore the coast';}
  function say(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.display='none',2200);}
  function enterExit(){if(mode==='foot'){mode='vehicle';vehicleType=vehicleType||'car';active().position.copy(player.position);active().rotation.y=heading;say('You entered the '+vehicleType+'!');}else{player.position.copy(active().position);player.position.y=0;mode='foot';say('Back on foot. Explore Devgad!');}updateVisibility();}
  document.getElementById('drive').addEventListener('click',enterExit);
  document.getElementById('vehicle').addEventListener('click',()=>{vehicleType=vehicleType==='car'?'bike':'car';if(mode==='vehicle'){const p=active().position.clone();car.position.copy(p);bike.position.copy(p);car.rotation.y=heading;bike.rotation.y=heading;}updateVisibility();say('Selected '+vehicleType+'. Tap Enter / Exit to use it.');});
  document.getElementById('reset').addEventListener('click',()=>{player.position.set(0,0,40);car.position.copy(player.position);bike.position.copy(player.position);heading=0;player.rotation.y=0;car.rotation.y=0;bike.rotation.y=0;mode='foot';updateVisibility();say('Back to Devgad starting point.');});
  document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed');};const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('pressed');};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));});
  const keymap={KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
  addEventListener('keydown',e=>{if(keymap[e.code]){keys[keymap[e.code]]=true;e.preventDefault();}if(e.code==='KeyE')enterExit();if(e.code==='KeyV')document.getElementById('vehicle').click();});
  addEventListener('keyup',e=>{if(keymap[e.code])keys[keymap[e.code]]=false;});
  const cameraOffset=new THREE.Vector3(0,7,12);const lookOffset=new THREE.Vector3(0,1.3,0);
  function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const obj=active();
    if(keys.left)heading+=2.25*dt;if(keys.right)heading-=2.25*dt;
    const moving=(keys.forward?1:0)-(keys.back?1:0);
    if(moving){const v=speed[mode==='foot'?'foot':vehicleType]*moving*dt;obj.position.x-=Math.sin(heading)*v;obj.position.z-=Math.cos(heading)*v;}
    obj.rotation.y=heading;
    obj.position.x=THREE.MathUtils.clamp(obj.position.x,-118,118);obj.position.z=THREE.MathUtils.clamp(obj.position.z,-118,118);obj.position.y=0;
    const desired=new THREE.Vector3(obj.position.x+Math.sin(heading)*cameraOffset.z, obj.position.y+cameraOffset.y, obj.position.z+Math.cos(heading)*cameraOffset.z);
    camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(obj.position.x,obj.position.y+lookOffset.y,obj.position.z);
    renderer.render(scene,camera);
  }
  const clock=new THREE.Clock();updateVisibility();camera.position.set(0,8,55);animate();loading.style.display='none';
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));});
})();
</script>
</body>
</html>
