<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Devgad Open World 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd7ee;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;color:#fff;text-shadow:0 2px 4px #123;pointer-events:none}.panel{background:#09253ddd;border:1px solid #b4edff66;border-radius:14px;padding:9px 12px}#name{font-weight:900;font-size:14px}#status{font-size:12px}.info{font-size:11px;text-align:right}#controls{position:fixed;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px}.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:46px 46px 46px;gap:5px}button{background:#092b43dd;color:white;border:1px solid #ffffff80;border-radius:14px;font-size:17px;font-weight:800;touch-action:none;user-select:none}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:flex;flex-direction:column;gap:7px}.actions button{min-width:100px;font-size:11px;padding:12px 8px}button:active,.pressed{background:#078ed9}#toast{display:none;position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#09253df0;color:white;padding:9px 13px;border-radius:12px;font-size:12px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#102a40;color:white;z-index:5;text-align:center}
</style></head><body><div id="game"></div><div id="loading">Loading Devgad 3D World…</div><div id="hud"><div class="panel"><div id="name">🌊 DEVGAD OPEN WORLD 3D</div><div id="status">Walking • Explore the coast</div></div><div class="panel info">Slim avatar + vehicles<br>WASD / touch controls</div></div><div id="toast"></div><div id="controls"><div class="pad"><button class="up" data-k="f">▲</button><button class="left" data-k="l">◀</button><button class="down" data-k="b">▼</button><button class="right" data-k="r">▶</button></div><div class="actions"><button id="enter">🚗 Enter / Exit</button><button id="switch">🏍️ Switch Car/Bike</button><button id="reset">↻ Reset</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const loading=document.querySelector('#loading'),status=document.querySelector('#status'),toast=document.querySelector('#toast');if(!window.THREE){loading.textContent='3D engine failed. Check internet and refresh.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd7ee);scene.fog=new THREE.Fog(0x8bd7ee,130,320);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,700);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe0f8ff,0x496344,2));const sun=new THREE.DirectionalLight(0xffe7c2,2.4);sun.position.set(-50,90,40);scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const grass=M(0x659e51),sand=M(0xe6d19a),road=M(0x3d4246),yellow=M(0xffe6a0),sea=M(0x1684ad),roof=M(0xb84b31),wood=M(0x765038),leaf=M(0x287b48),wall=M(0xf0c779),glass=M(0x66c4e0),dark=M(0x202326),red=M(0xd84532),skin=M(0xdba77f),shirt=M(0x1768d1),pants=M(0x202f49),shoe=M(0x15191f);
function mesh(g,m,x,y,z,p=scene){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o}function box(w,h,d,m,x,y,z,p=scene){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p)}
// FIX: use a single flat terrain plane. The old thick ground box could overlap
// with other surfaces on some mobile GPUs and cause green/blue flickering.
const terrain=mesh(new THREE.PlaneGeometry(250,235),grass,0,-.05,0);
terrain.rotation.x=-Math.PI/2;
const ocean=mesh(new THREE.PlaneGeometry(800,800),sea,0,-1.4,-70);
ocean.rotation.x=-Math.PI/2;
box(250,.12,22,sand,0,.02,-105);box(16,.12,220,road,0,.03,0);box(220,.12,14,road,0,.04,20);box(7,.1,100,road,-48,.03,-12);box(92,.1,7,road,-22,.03,-48);for(let z=-100;z<110;z+=12)box(.2,.025,5,yellow,0,.1,z);for(let x=-100;x<110;x+=13)box(4,.025,.2,yellow,x,.1,20);
function tree(x,z,s=1){mesh(new THREE.CylinderGeometry(.18*s,.3*s,2.4*s,7),wood,x,1.1*s,z);for(let i=0;i<3;i++)mesh(new THREE.ConeGeometry(1.2*s,2*s,7),leaf,x,2*s+i*.55*s,z)}
function house(x,z,c){let w=M(c);box(6,3.5,5,w,x,1.75,z);let r=mesh(new THREE.ConeGeometry(4.5,2,4),roof,x,4.4,z);r.rotation.y=Math.PI/4;box(1,2,.13,wood,x,1,z+2.56);box(1,1,.14,glass,x-1.6,2,z+2.58)}
for(let i=0;i<30;i++){let x=(Math.random()-.5)*180,z=(Math.random()-.5)*175;if(Math.abs(x)<13&&Math.abs(z)<28)continue;house(x,z,[0xf0c779,0xe6e0d1,0xe5a18b,0xc5d6a1,0xd4c1ed][i%5])}for(let i=0;i<95;i++){let x=(Math.random()-.5)*230,z=(Math.random()-.5)*205;if(Math.abs(x)<11||Math.abs(z-20)<9||z<-95)continue;tree(x,z,.6+Math.random()*.6)}
mesh(new THREE.CylinderGeometry(1.7,2.5,13,10),M(0xf4eee0),34,6.5,-91);mesh(new THREE.CylinderGeometry(2.1,2.1,1.2,10),red,34,13.6,-91);
// Slim humanoid avatar: separate head, narrow torso, arms, legs and shoes
const player=new THREE.Group();scene.add(player);mesh(new THREE.CapsuleGeometry(.24,.62,4,8),shirt,0,1.35,0,player);mesh(new THREE.SphereGeometry(.25,12,10),skin,0,2.02,0,player);
for(const x of [-.34,.34]){let arm=mesh(new THREE.CapsuleGeometry(.085,.58,3,6),skin,x,1.38,0,player);arm.rotation.z=x<0?-.12:.12}
for(const x of [-.14,.14]){mesh(new THREE.CapsuleGeometry(.09,.62,3,6),pants,x,.65,0,player);box(.18,.12,.3,shoe,x,.17,-.06,player)}
const car=new THREE.Group();scene.add(car);box(2.1,.75,3.9,red,0,.82,0,car);box(1.55,.75,1.8,glass,0,1.52,-.15,car);for(const x of [-1.08,1.08])for(const z of [-1.25,1.25]){let w=mesh(new THREE.CylinderGeometry(.32,.32,.2,12),dark,x,.42,z,car);w.rotation.z=Math.PI/2}
const bike=new THREE.Group();scene.add(bike);box(.38,.4,1.55,dark,0,.82,0,bike);mesh(new THREE.SphereGeometry(.36,10,8),red,0,1.08,-.15,bike);for(const z of [-.72,.72])mesh(new THREE.TorusGeometry(.34,.085,8,14),dark,0,.4,z,bike);
let mode='foot',type='car',heading=0;const keys={f:false,b:false,l:false,r:false};player.position.set(0,0,42);car.position.copy(player.position);bike.position.copy(player.position);function active(){return mode==='foot'?player:type==='car'?car:bike}function update(){player.visible=mode==='foot';car.visible=mode==='vehicle'&&type==='car';bike.visible=mode==='vehicle'&&type==='bike';status.textContent=mode==='foot'?'Walking • Slim avatar':type==='car'?'Driving car':'Riding bike'}function say(t){toast.textContent=t;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>toast.style.display='none',2000)}function enter(){if(mode==='foot'){mode='vehicle';active().position.copy(player.position);active().rotation.y=heading;say('Entered '+type)}else{player.position.copy(active().position);mode='foot';say('Back on foot')}update()}document.querySelector('#enter').onclick=enter;document.querySelector('#switch').onclick=()=>{type=type==='car'?'bike':'car';car.position.copy(active().position);bike.position.copy(active().position);car.rotation.y=bike.rotation.y=heading;update();say('Selected '+type+' — tap Enter / Exit')};document.querySelector('#reset').onclick=()=>{player.position.set(0,0,42);car.position.copy(player.position);bike.position.copy(player.position);heading=0;mode='foot';update();say('Reset to start')};
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,off))});let km={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=true;e.preventDefault()}if(e.code==='KeyE')enter();if(e.code==='KeyV')document.querySelector('#switch').click()});addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=false});
const clock=new THREE.Clock(),offset=new THREE.Vector3(0,6.2,10);function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),o=active();if(keys.l)heading+=2.2*dt;if(keys.r)heading-=2.2*dt;let move=(keys.f?1:0)-(keys.b?1:0);if(move){let s=mode==='foot'?7:type==='car'?17:21;o.position.x-=Math.sin(heading)*s*move*dt;o.position.z-=Math.cos(heading)*s*move*dt}o.rotation.y=heading;o.position.x=THREE.MathUtils.clamp(o.position.x,-117,117);o.position.z=THREE.MathUtils.clamp(o.position.z,-117,117);let target=new THREE.Vector3(o.position.x+Math.sin(heading)*offset.z,o.position.y+offset.y,o.position.z+Math.cos(heading)*offset.z);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(o.position.x,o.position.y+1.15,o.position.z);renderer.render(scene,camera)}update();animate();loading.style.display='none';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
})();
</script></body></html>
